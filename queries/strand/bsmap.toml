# BSMAP 2.6 / 2.90 / BSMAPz -- ZS:Z, four-way from the tag alone.
#
# Read 2026-09-17 from BSMAP 2.90 (param.cpp:234, emitted align.cpp:690 and
# pairs.cpp:354,410,490; README.txt:121-124).
#
# ZS's first character is the conversion strand (Watson +, Crick -) and its second is the
# read's orientation within that strand, so the pair names all four strands of origin.
# BSMAP's FLAG is conformant -- 0x10 is set exactly when the two characters differ -- but
# the rule does not need it, which is the point.
#
# Valid for -n 1 (non-directional) unchanged, and needed even at the default -n 0: a
# paired-end run emits all four ZS values, because read 2 is searched against the
# complementary chain (align.cpp:93-94).
#
# Checked 2026-09-17 against real BSMAP 2.90 output (validation/demos/bsmap-strand), both
# layouts: two pairs at -n 0 and four at -n 1. All four ZS values did appear at -n 0, from
# two pairs alone, so a two-way reading of ZS would be wrong on half of a directional
# library's records. The FLAG was conformant on all twelve records -- 0x10 set exactly when
# ZS's two characters differ, and agreeing with how SEQ was really stored -- and SEQ was
# reference-forward throughout.
#
# What that run also found: at -n 1, BSMAP itself puts some CTOT and CTOB reads on the
# opposite conversion strand, at the right position and reported as unique, because its hit
# deduplication keys on the forward position and ignores which converted chain the hit came
# from (align.h:232-249, align.cpp:211,269). 10 of 228 copy-strand reads in that demo's
# sweep. This rule reports what ZS says, which is the honest thing for a rule to do; the
# error is in the BAM, and alnbase's reference-mismatch count is what surfaces it.

[strand.origin]
OT   = 'ZS == "++"'
CTOT = 'ZS == "+-"'
OB   = 'ZS == "-+"'
CTOB = 'ZS == "--"'
