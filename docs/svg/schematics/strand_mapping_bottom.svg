  <line x1="408" y1="216" x2="488" y2="216" class="solid"></line>
  <polygon points="488,212 496,216 488,220" class="filled"></polygon>
  <text x="66" y="236" >R2</text>
  <line x1="272" y1="232" x2="352" y2="232" class="solid"></line>
  <polygon points="352,228 360,232 352,236" class="filled"></polygon>
  <line x1="272" y1="248" x2="352" y2="248" class="solid"></line>
