<svg xmlns="http://www.w3.org/2000/svg" width="608" height="272" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="608" height="272"></rect>
  <rect x="4" y="8" width="592" height="240" class="solid nofill" rx="0"></rect>
  <text x="66" y="76" >OT</text>
  <text x="66" y="92" >OB</text>
  <line x1="160" y1="72" x2="504" y2="72" class="solid"></line>
  <polygon points="504,68 512,72 504,76" class="filled"></polygon>
  <polygon points="168,84 160,88 168,92" class="filled"></polygon>
  <line x1="168" y1="88" x2="512" y2="88" class="solid"></line>
  <text x="66" y="156" >OT</text>
  <text x="66" y="172" >CTOT</text>
  <line x1="160" y1="152" x2="504" y2="152" class="solid"></line>
  <polygon points="504,148 512,152 504,156" class="filled"></polygon>
  <polygon points="168,164 160,168 168,172" class="filled"></polygon>
  <line x1="168" y1="168" x2="512" y2="168" class="solid"></line>
  <text x="66" y="204" >CTOB</text>
  <text x="66" y="220" >OB</text>
  <line x1="160" y1="200" x2="504" y2="200" class="solid"></line>
  <polygon points="504,196 512,200 504,204" class="filled"></polygon>
  <polygon points="168,212 160,216 168,220" class="filled"></polygon>
  <line x1="168" y1="216" x2="512" y2="216" class="solid"></line>
  <text x="26" y="44" >native fragment</text>
  <text x="122" y="76" >5′</text>
  <text x="522" y="76" >3′</text>
  <text x="122" y="92" >3′</text>
  <text x="522" y="92" >5′</text>
  <text x="26" y="124" >PCR separates and complements the strands</text>
  <text x="122" y="156" >5′</text>
  <text x="522" y="156" >3′</text>
  <text x="122" y="172" >3′</text>
  <text x="522" y="172" >5′</text>
  <text x="122" y="204" >5′</text>
  <text x="522" y="204" >3′</text>
  <text x="122" y="220" >3′</text>
  <text x="522" y="220" >5′</text>
</svg>