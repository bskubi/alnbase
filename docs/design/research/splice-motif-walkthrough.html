<style>

    --bad: #ff7a6b; --bad-bg: #3d1e1a;

  --line: #2e3138; --line-2: #3f434c;
  --edit: #4fd39a; --edit-bg: #12372a;
  --bad: #ff7a6b; --bad-bg: #3d1e1a;

* { box-sizing: border-box; }

  margin: 0; background: var(--bg); color: var(--ink);
  font-family: Inter, system-ui, -apple-system, sans-serif;

}
.wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 96px; }

.lede { font-size: clamp(17px, 2.4vw, 19px); color: var(--ink-2); max-width: 46em; }
header.top { padding: 56px 0 36px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }

.eyebrow { font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.sub { max-width: 44em; }

.caption { font-size: 15px; color: var(--ink-2); margin: 14px 0 0; max-width: 44em; }
.caption strong { color: var(--ink); font-weight: 600; }

.mono { font-family: 'Roboto Mono', monospace; }
.tag { display: inline-block; font-family: 'Roboto Mono', monospace; font-size: 11.5px;

button.seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* motif */

.di { font-family: 'Roboto Mono', monospace; font-size: 30px; font-weight: 700; letter-spacing: .1em; }
.di .keep { color: var(--ink-2); }
.di .lost { color: var(--bad); }
.di .arrow { color: var(--ink-3); font-size: 18px; margin: 0 12px; vertical-align: 3px; }

/* degeneracy */
.seqstrip { font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: .5px;

.seqstrip .hit { background: var(--warn-bg); color: var(--warn); font-weight: 700; border-radius: 2px; }

.ba { display: grid; gap: 12px; }

.bacard.next { border-color: var(--edit); }
.bacard h4 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ------------------------------------------------- 1. the collapse */

const TRANSFORMS = [
  { id: "a2g", from: "A", to: "G" },
  { id: "t2c", from: "T", to: "C" },
  { id: "a2c", from: "A", to: "C" },
  { id: "t2g", from: "T", to: "G" },
  { id: "g2c", from: "G", to: "C" },
  { id: "a2t", from: "A", to: "T" },
];

const apply = (t, s) => s.split("").map((c) => (c === t.from ? t.to : c)).join("");

function Motif({ label, orig, now }) {
  const survives = orig === now;
  return (
    <div className="mcard">
      <h4>{label}</h4>
      <div className="di">
        <span className="keep">{orig}</span>
        <span className="arrow">&rarr;</span>
        {now.split("").map((c, i) => (
          <span key={i} className={c === orig[i] ? "keep" : "lost"}>{c}</span>
        ))}
      </div>
      <div className={"verdict2 " + (survives ? "ok" : "no")}>
        {survives ? "survives" : "gone"}
      </div>
    </div>
  );
}

function Collapse() {
  const [ti, setTi] = useState(0);
  const t = TRANSFORMS[ti];
  return (
    <div className="panel">
      <div className="btnrow">
        {TRANSFORMS.map((x, i) => (
          <button key={x.id} className="seg" aria-pressed={ti === i} onClick={() => setTi(i)}>
            <span className="mono">{x.id}</span> &nbsp;{x.from}&rarr;{x.to}
          </button>
        ))}
      </div>
      <div className="motifrow">
        <Motif label="donor, start of the intron" orig="GT" now={apply(t, "GT")} />
        <Motif label="acceptor, end of the intron" orig="AG" now={apply(t, "AG")} />
      </div>

      <table className="tgrid">
        <thead>
          <tr><th style={{ textAlign: "left" }}>transform</th><th>donor GT</th><th>acceptor AG</th><th>intron findable by motif</th></tr>
        </thead>
        <tbody>
          {TRANSFORMS.map((x) => {
            const d = apply(x, "GT"), a = apply(x, "AG");
            return (
              <tr key={x.id}>
                <td className="name">{x.id}</td>
                <td><span className={"pill " + (d === "GT" ? "ok" : "no")}>{d}</span></td>
                <td><span className={"pill " + (a === "AG" ? "ok" : "no")}>{a}</span></td>
                <td><span className="pill no">no</span></td>
              </tr>
            );
          })}
        </tbody>
      </table>

      <p className="caption">
        Nearly every human intron starts <span className="tag">GT</span> and ends
        <span className="tag"> AG</span>, and a splice-aware aligner uses that to decide whether
        a gap in an alignment is a real intron. <strong>No three-letter transform leaves both
        intact</strong> — and one of them, g2c, destroys both at once.
      </p>
    </div>
  );
}

/* ------------------------------------- 2. why the collapsed motif is useless */

const STRIP = "CTGAGTTACAGGCATGAGCCACCGCGCCTGGCCTAAGATTTTTAAGTTTTAGTAGAGACGGG";

function mark(seq, di) {
  const out = [];
  let i = 0;
  while (i < seq.length) {
    if (seq.slice(i, i + 2) === di) {
      out.push(<span key={i} className="hit">{di}</span>);
      i += 2;
    } else {
      out.push(<span key={i}>{seq[i]}</span>);
      i += 1;
    }
  }
  return out;
}

function Degeneracy() {
  const collapsed = STRIP.replace(/A/g, "G");
  const nOrig = (STRIP.match(/AG/g) || []).length;
  const nColl = (collapsed.match(/GG/g) || []).length;
  return (
    <div className="panel">
      <div className="scroller">
        <div className="slab">looking for the acceptor AG in the real genome</div>
        <div className="seqstrip">{mark(STRIP, "AG")}</div>
        <div className="slab">looking for its a2g image GG in the collapsed genome</div>
        <div className="seqstrip">{mark(collapsed, "GG")}</div>
      </div>

      <div className="readouts">
        <div className="ro">
          <div className="k">in this window</div>
          <div className="v">{nOrig} &rarr; {nColl}</div>
        </div>
        <div className="ro">
          <div className="k">acceptor, whole of chr21</div>
          <div className="v">1 per 14.6 bp</div>
        </div>
        <div className="ro alarm">
          <div className="k">its image in a2g space</div>
          <div className="v">1 per 3.6 bp</div>
        </div>
        <div className="ro alarm">
          <div className="k">candidate sites</div>
          <div className="v">4.0&times;</div>
        </div>
      </div>

      <p className="caption">
        The obvious patch is to tell the aligner that in a2g space the acceptor reads
        <span className="tag"> GG</span> instead. It does not help. The collapse is many-to-one:
        <span className="tag"> GG</span> in the index could have been <span className="mono">AG</span>,
        <span className="mono"> GA</span>, <span className="mono">GG</span> or <span className="mono">AA</span>.
        <strong> A motif that matches one position in four is not a motif, it is the background.</strong>
      </p>
      <p className="note">
        Counts over the 38 Mb of unambiguous sequence in hg38 chr21. The a2g genome is half G:
        A 29.5% + G 20.5% become G 49.9%.
      </p>
    </div>
  );
}

/* --------------------------------------------- 3. how much it actually costs */

const ANCHORS = [4, 6, 8, 10, 11, 12, 13, 14, 15, 16, 18, 20, 25, 30, 40];
const SERIES = [
  { id: "collapsed", label: "three-letter genome, no annotation", color: "var(--bad)",
    y: [0, 0, 0, 0, 0, 0, 15.7, 69.5, 81.3, 83.7, 85.5, 100, 100, 100, 100] },
  { id: "restored", label: "same genome with GT..AG written back in", color: "var(--warn)",
    y: [0, 0, 0, 0, 0, 68.3, 82.2, 84.2, 81.3, 83.7, 85.5, 100, 100, 100, 100] },
  { id: "annot", label: "three-letter genome, junctions supplied", color: "var(--edit)",
    y: [83.8, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100] },
];

function AnchorCurve() {
  const W = 620, H = 260, L = 46, R = 14, T = 14, B = 34;
  const x = (i) => L + (i / (ANCHORS.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - v / 100) * (H - T - B);
  const path = (ys) => ys.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const bandLo = x(ANCHORS.indexOf(12)) - 10;
  const bandHi = x(ANCHORS.indexOf(14)) + 10;

  return (
    <div className="panel">
      <div className="scroller">
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ minWidth: 520, display: "block" }}
             role="img" aria-label="Junction recovery against anchor length">
          <rect x={bandLo} y={T} width={bandHi - bandLo} height={H - T - B}
                fill="var(--warn-bg)" opacity="0.75" />
          <text x={(bandLo + bandHi) / 2} y={T + 13} textAnchor="middle" fontSize="10.5"
                fill="var(--warn)" fontFamily="Inter" fontWeight="650">the motif matters here</text>
          {[0, 25, 50, 75, 100].map((v) => (
            <g key={v}>
              <line x1={L} y1={y(v)} x2={W - R} y2={y(v)} stroke="var(--line)" strokeWidth="1" />
              <text x={L - 8} y={y(v) + 3.5} textAnchor="end" fontSize="10"
                    fill="var(--ink-3)" fontFamily="Roboto Mono">{v}</text>
            </g>
          ))}
          {ANCHORS.map((a, i) => (
            <text key={a} x={x(i)} y={H - B + 15} textAnchor="middle" fontSize="9.5"
                  fill="var(--ink-3)" fontFamily="Roboto Mono">{a}</text>
          ))}
          <text x={(L + W - R) / 2} y={H - 3} textAnchor="middle" fontSize="10.5"
                fill="var(--ink-3)" fontFamily="Inter">bases of the read on the short side of the junction</text>
          {SERIES.map((s) => (
            <g key={s.id}>
              <path d={path(s.y)} fill="none" stroke={s.color} strokeWidth="2.2"
                    strokeLinejoin="round" strokeLinecap="round" />
              {s.y.map((v, i) => (
                <circle key={i} cx={x(i)} cy={y(v)} r="2.6" fill={s.color} />
              ))}
            </g>
          ))}
        </svg>
      </div>
      <div className="legend">
        {SERIES.map((s) => (
          <span key={s.id}><i style={{ background: s.color }} />{s.label}</span>
        ))}
      </div>
      <p className="caption">
        Same reads, same alphabet, same repeat content. The only difference between the red and
        amber lines is four bases per intron written back into the reference, so the gap between
        them is the motif and nothing else. <strong>It is a three-base band.</strong> Below a
        twelve-base anchor no junction is found either way; above fifteen the motif contributes
        nothing. In between, it is the whole difference.
      </p>
      <p className="caption">
        The green line is what matters in practice. <strong>Supplying the junctions beats the
        motif everywhere</strong>, and recovers reads that overlap by as little as six bases —
        which no amount of motif ever would.
      </p>
      <p className="note">
        9,000 simulated junction-spanning reads, three-letter transformed, aligned with HISAT2. A
        junction counts as found only when the gap in the CIGAR is exactly the length of the real
        intron.
      </p>
    </div>
  );
}

/* ---------------------------------------------- 4. the specificity cost */

function Spurious() {
  return (
    <div className="panel">
      <div className="readouts">
        <div className="ro alarm">
          <div className="k">gaps placed at a wrong intron</div>
          <div className="v">499</div>
          <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 4 }}>no annotation</div>
        </div>
        <div className="ro" style={{ borderColor: "var(--edit)", background: "var(--edit-bg)" }}>
          <div className="k" style={{ color: "var(--edit)" }}>with junctions supplied</div>
          <div className="v" style={{ color: "var(--edit)" }}>0</div>
          <div style={{ fontSize: 12, color: "var(--edit)", marginTop: 4 }}>out of the same 9,000 reads</div>
        </div>
      </div>
      <p className="caption">
        This is the part that should worry a hyper-editing pipeline more than the missed reads. A
        junction placed in the wrong spot does not produce a gap in the output — it produces a
        read aligned to the wrong sequence, and therefore <strong>a burst of mismatches that look
        exactly like dense editing.</strong> The method's entire signal is dense mismatch
        clusters. Supplying the junctions removes every one of these.
      </p>
    </div>
  );
}

/* ---------------------------------------- 5. how many reads are in the zone */

function DangerZone() {
  const [pos, setPos] = useState(12);        // bases of the read left of the junction
  const LEN = 100;
  const anchor = Math.min(pos, LEN - pos);
  const zone = anchor < 15;
  const W = 620, H = 92;
  const jx = 310;
  const scale = 2.4;                          // px per base
  const left = jx - pos * scale;

  return (
    <div className="panel">
      <div className="scroller">
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ minWidth: 520, display: "block" }}
             role="img" aria-label="A read overlapping an exon junction">
          <rect x="10" y="50" width={jx - 10} height="20" rx="3" fill="var(--inert-bg)" stroke="var(--line-2)" />
          <rect x={jx} y="50" width={W - 10 - jx} height="20" rx="3" fill="var(--inert-bg)" stroke="var(--line-2)" />
          <text x={jx / 2} y="64" textAnchor="middle" fontSize="10" fill="var(--ink-3)" fontFamily="Inter">exon</text>
          <text x={(jx + W - 10) / 2} y="64" textAnchor="middle" fontSize="10" fill="var(--ink-3)" fontFamily="Inter">exon</text>
          <line x1={jx} y1="42" x2={jx} y2="78" stroke="var(--ink-3)" strokeWidth="1" strokeDasharray="3 3" />
          <text x={jx} y="88" textAnchor="middle" fontSize="9.5" fill="var(--ink-3)" fontFamily="Inter">junction</text>
          <rect x={left} y="22" width={LEN * scale} height="14" rx="3"
                fill={zone ? "var(--bad-bg)" : "var(--edit-bg)"}
                stroke={zone ? "var(--bad)" : "var(--edit)"} />
          <line x1={pos < LEN - pos ? left : jx} y1="18"
                x2={pos < LEN - pos ? jx : left + LEN * scale} y2="18"
                stroke={zone ? "var(--bad)" : "var(--edit)"} strokeWidth="2" />
          <text x={jx} y="12" textAnchor="middle" fontSize="10"
                fill={zone ? "var(--bad)" : "var(--edit)"} fontFamily="Roboto Mono" fontWeight="700">
            anchor {anchor} bp
          </text>
        </svg>
      </div>
      <div className="sliderow">
        <span style={{ fontSize: 13, color: "var(--ink-3)" }}>slide the read</span>
        <input type="range" min="1" max="99" value={pos}
               onChange={(e) => setPos(Number(e.target.value))} />
      </div>
      <div className="readouts">
        <div className={zone ? "ro alarm" : "ro"}>
          <div className="k">this read</div>
          <div className="v">{zone ? "needs the annotation" : "fine either way"}</div>
        </div>
        <div className="ro alarm">
          <div className="k">reads with an anchor under 15</div>
          <div className="v">28%</div>
        </div>
      </div>
      <p className="caption">
        A junction-spanning read can sit anywhere across the boundary, so for a 100 bp read the
        short side is roughly uniform from 1 to 50. <strong>Twenty-eight per cent of
        junction-spanning reads land in the range where de novo splicing fails</strong> and the
        annotation is doing all the work. They are not an edge case.
      </p>
    </div>
  );
}

/* ------------------------------------------- 6. why supplying them is legal */

const OSEQ = "TTGCAGATCCAGTAAGCTTAC";

function Coordinates() {
  const collapsed = OSEQ.replace(/A/g, "G");
  const cell = 19;
  const row = (seq, lab, dim) => (
    <div style={{ marginBottom: 8 }}>
      <div className="slab">{lab}</div>
      <div style={{ display: "flex", gap: 1 }}>
        {seq.split("").map((c, i) => (
          <div key={i} style={{
            width: cell, minWidth: cell, height: 24, display: "flex",
            alignItems: "center", justifyContent: "center", borderRadius: 3,
            fontFamily: "'Roboto Mono', monospace", fontSize: 13,
            background: dim && c !== OSEQ[i] ? "var(--accent-bg)" : "var(--inert-bg)",
            color: dim && c !== OSEQ[i] ? "var(--accent)" : "var(--ink-3)",
            fontWeight: dim && c !== OSEQ[i] ? 700 : 500,
          }}>{c}</div>
        ))}
      </div>
    </div>
  );
  return (
    <div className="panel">
      <div className="scroller">
        <div style={{ minWidth: OSEQ.length * (cell + 1) }}>
          <div style={{ display: "flex", gap: 1, marginBottom: 2 }}>
            {OSEQ.split("").map((_, i) => (
              <div key={i} style={{
                width: cell, minWidth: cell, textAlign: "center",
                fontFamily: "'Roboto Mono', monospace", fontSize: 9, color: "var(--ink-3)",
              }}>{i % 5 === 0 ? i : "·"}</div>
            ))}
          </div>
          {row(OSEQ, "reference", false)}
          {row(collapsed, "after a2g", true)}
        </div>
      </div>
      <p className="caption">
        The transform substitutes one base for another and does nothing else — no insertions, no
        deletions, no reordering. <strong>Every coordinate is identical in all seven
        genomes.</strong> That is what makes handing the aligner a junction list legitimate rather
        than a fudge: you are supplying coordinates, and coordinates are the one thing the
        collapse preserves exactly.
      </p>
    </div>
  );
}

function Fix() {
  return (
    <div className="ba">
      <div className="bacard">
        <h4>annotation from GENCODE</h4>
        <ul>
          <li>Works immediately, no extra compute.</li>
          <li>Blind to novel junctions, unannotated isoforms and back-splices.</li>
          <li>Ties the result to whichever annotation build you used.</li>
        </ul>
      </div>
      <div className="bacard next">
        <h4>junctions from the sample itself</h4>
        <ul>
          <li>First pass: align the whole library to the <em>untransformed</em> genome, splice-aware, and keep the junctions it finds.</li>
          <li>The hyper-edited reads fail that pass by construction — but they do not need to. You only want the catalogue, and the ordinary 95% of the library defines it.</li>
          <li>Novel and tissue-specific junctions included, in the actual sample.</li>
          <li>The pipeline already aligns everything once at this stage.</li>
        </ul>
      </div>
    </div>
  );
}

      </header>

      <section>

        <Collapse />

        <p className="eyebrow">the obvious patch, and why it fails</p>

        <h2>Where it actually hurts</h2>

        </p>
        <div className="callout">
          <b>What we guessed:</b> no motif, no junctions.
          <b> What the run says:</b> a well-anchored junction is found without the motif perfectly

        </div>
        <AnchorCurve />
      </section>

      <section>

        <h2>Junctions in the wrong place</h2>

      <section>
        <p className="eyebrow">the fix</p>
        <h2>Give it the junctions</h2>
