# Contexts defined by exclusion. Reference: TTCNNTTTCNGTTTCGNTTTCATTTCAGTT
# (every read base equals the reference, so read C = unconverted).

[pat.c3]                 # any reference C with two columns after it
read = "C~~"
refr = "C~~"
[pat.cg]
read = "~~~"
refr = "CG~"
[pat.cxg]                # C, anything, G
read = "~~~"
refr = "C~G"

# IUPAC-strict contexts: an N in the reference is not H, so CNN and CNG fit none.
[query.CHH_strict]
read = "C~~"
refr = "CHH"
[query.CHG_strict]
read = "C~~"
refr = "CHG"

# MethylDackel-style: N counts as H. CHG = C?G that is not CG; CHH = the rest.
[query.CHG_n_as_h]
where = "cxg and not cg"
[query.CHH_n_as_h]
where = "c3 and not cg and not cxg"
[query.CG]
where = "cg and c3"
