# Firing semantics. Query order in the file is the order rows are emitted in
# when several queries fire on the same column.

[query.AA]          # overlapping occurrences each fire (AAAA -> 3 hits)
read = "AA"
refr = "AA"

[query.CG]          # fires when the G column arrives; anchor = column 0 (the C)
read = "C~"
refr = "CG"

[query.C]           # one column wide: fires on the C column itself
read = "C"
refr = "C"

[query.wide]        # 5 columns: makes max span 5, so the walk adds 5 flank
read = "T~~~~"      # columns (read = pad) at each end of EVERY record
refr = "T~~~~"

# The last two match only pad columns, so they fire only in the flank, and only
# because `wide` makes it 5 columns wide: with the default --end-context (the widest
# span) their hits follow the widest query in the run. Pass --end-context, or
# exclude such windows with `and not`, to fix them (02-query-language.md §8.6).

[query.flankC]      # a read-side pad over a reference C: fires in the flank
read = "_"
refr = "C"

[query.offcontig]   # pad on both sides: flank columns past the contig end
read = "_"
refr = "_"
