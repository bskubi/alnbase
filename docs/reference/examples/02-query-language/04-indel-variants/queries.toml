# Enumerating indel placements inside ONE query, combined with `or`.
# All operands of a query must have the same width, so shorter variants are
# padded with `~` columns.

[alias]
b = "{N_}"      # a read base, or past the read end -- but NOT another deletion

# --- A. CG context that skips up to two deleted reference bases -------------
# Column 0 is the cytosine (the default anchor). Exactly one variant can hold
# at a given C, because each one fixes which of columns 1-2 are deletions.
[pat.cg_0del]
read = "Cb~~"
refr = "CG~~"

[pat.cg_1del]            # the base after the C is deleted from the read
read = "C.b~"
refr = "C~G~"

[pat.cg_2del]            # the two bases after the C are deleted
read = "C..b"
refr = "C~~G"

[query.CG_skipping_deletions]
where = "cg_0del or cg_1del or cg_2del"

[query.CG_genomic]       # for contrast: the reference CG only
read = "C~"
refr = "CG"

# --- B. One A deleted from a run of exactly four, wherever the aligner put the
# gap. The anchor is the column of the run's FIRST reference A in every
# variant, so all placements report the same refr_pos. (Its read side is a
# gap in variant 1, so this query could not drive a `bases` tag.)
[pat.hp_del1]
read = "~.AAA~"
refr = "BAAAAB"
[pat.hp_del2]
read = "~A.AA~"
refr = "BAAAAB"
[pat.hp_del3]
read = "~AA.A~"
refr = "BAAAAB"
[pat.hp_del4]
read = "~AAA.~"
refr = "BAAAAB"

[query.A4_one_deleted]
mark  = ".+...."
where = "hp_del1 or hp_del2 or hp_del3 or hp_del4"
