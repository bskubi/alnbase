[query.CG]                  # refr_base fixed: C
read = "C~"
refr = "CG"

[query.TG]                  # refr_base fixed: C
read = "T~"
refr = "CG"

[query.eqG]                 # '=' on the refr side at the anchor: refr_base = read base
read = "G"
refr = "="

[query.mm]                  # '/' at the anchor: several possible refr bases -> null in extract
read = "N"
refr = "/"

[query.spare]               # in no tag: reported by query --parquet only
read = "T"
refr = "T"

[tag.XM.bases]
fill = "."
Z = "CG"
z = "TG"

[tag.XX.bases]
fill = "-"
g = "eqG"
m = "mm"

[tag.XR.strand]
CT = ["OT", "OB"]
GA = ["CTOT", "CTOB"]
