# A CG call tag, plus an "end" query whose anchor is the pad column after
# the read's last base (so it has no SEQ position), plus a query no tag uses.
[query.TG]
read = "T~"
refr = "CG"

[query.CG]
read = "C~"
refr = "CG"

[query.end]
read = "N_"
refr = "~~"
mark = ".+"

[query.unused]
read = "C~"
refr = "C~"

[tag.XM.bases]
fill = "."
z = "TG"
Z = "CG"

[tag.XE.bases]
fill = "-"
e = "end"
