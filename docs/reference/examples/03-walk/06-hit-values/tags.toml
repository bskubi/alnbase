[query.Z]             # refr fixed to C under the anchor
read = "C~"
refr = "CG"
[query.z]
read = "T~"
refr = "CG"
[query.A_any]         # refr '~' under the anchor: extract cannot know it
read = "A"
refr = "~"
[query.G_same]        # '=' : refr is the read's own base
read = "G"
refr = "="
[tag.XM.bases]
fill = "."
Z = "Z"
z = "z"
a = "A_any"
g = "G_same"
