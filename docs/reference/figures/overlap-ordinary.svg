  <text x="10" y="12" >(a) Ordinary overlapping mates: pair_overlap, a 60 bp fragment chr1:41-100 read 40 + 40</text>
  <text x="146" y="44" >41</text>
  <text x="226" y="44" >51</text>
  <text x="306" y="44" >61</text>
  <text x="386" y="44" >71</text>
  <text x="466" y="44" >81</text>
  <text x="546" y="44" >91</text>
  <text x="618" y="44" >100</text>
  <text x="10" y="76" >chr1</text>
  <text x="10" y="108" >input</text>
  <text x="106" y="124" >40M  POS 41  PNEXT 61  TLEN 60  MC 40M</text>
  <text x="10" y="140" >R1 +</text>
  <text x="106" y="172" >40M  POS 61  PNEXT 41  TLEN -60  MC 40M</text>
  <text x="10" y="188" >R2 -</text>
  <text x="106" y="236" >chr1:61-80, 20 bases, L = 60</text>
  <text x="10" y="268" >output: equal scores, so R1 keeps the overlap and R2 gives up its 3&#39; 20 bases</text>
  <text x="106" y="300" >40M  POS 41  PNEXT 81  TLEN 60  MC 20S20M   (Q30+Q30 -&gt; Q40 over 61-80)</text>
  <text x="10" y="316" >R1 +</text>
  <text x="106" y="348" >20S20M  POS 81  PNEXT 41  TLEN -60  MC 40M</text>
  <text x="10" y="364" >R2 -</text>
  <text x="90" y="412" >a read, 5&#39; end to 3&#39; end: aligned (M)</text>
  <text x="90" y="428" >soft clip (S)</text>
  <text x="90" y="444" >hard clip (H): not in SEQ</text>
  <text x="90" y="460" >bases observed by both reads</text>
