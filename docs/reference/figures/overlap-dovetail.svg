  <text x="10" y="12" >(d) Dovetailing mates: read_through, a 30 bp molecule chr1:161-190 read 40 + 40</text>
  <text x="146" y="44" >151</text>
  <text x="226" y="44" >161</text>
  <text x="306" y="44" >171</text>
  <text x="386" y="44" >181</text>
  <text x="458" y="44" >190</text>
  <text x="538" y="44" >200</text>
  <text x="10" y="76" >chr1</text>
  <text x="10" y="108" >input: each read runs 10 bases of adapter past the other read&#39;s 5&#39; end, soft-clipped</text>
  <text x="106" y="140" >30M10S  POS 161  FLAG 99   TLEN 30</text>
  <text x="10" y="156" >R1 +</text>
  <text x="106" y="188" >10S30M  POS 161  FLAG 147  TLEN -30</text>
  <text x="10" y="204" >R2 -</text>
  <text x="106" y="252" >chr1:161-190, the whole molecule: L = 30 &lt; 40</text>
  <text x="10" y="284" >output: R1 keeps the overlap, so R2 gives up every aligned base</text>
  <text x="106" y="316" >30M10S  POS 161  FLAG 73 (0x8 set; 0x20, 0x2 cleared)  PNEXT 161  TLEN 0  MC *</text>
  <text x="10" y="332" >R1 +</text>
  <text x="106" y="364" >R2 -&gt; unmapped: FLAG 133 (0x4 set; 0x10, 0x2 cleared), RNAME/POS chr1:161 from R1,</text>
  <text x="106" y="380" >MAPQ 0, CIGAR *, TLEN 0, MC 30M10S, SEQ and QUAL reversed back to sequencing orientation</text>
  <text x="90" y="412" >a read, 5&#39; end to 3&#39; end: aligned (M)</text>
  <text x="90" y="428" >soft clip (S)</text>
  <text x="90" y="444" >hard clip (H): not in SEQ</text>
  <text x="90" y="460" >bases observed by both reads</text>
