  <text x="10" y="12" >(b) Methyl-HiC: hic_sup_overlap, molecule chr1:41-100 (+) joined to chr2:101-140 (+), L = 100</text>
  <text x="130" y="44" >chr1:41</text>
  <text x="306" y="44" >61</text>
  <text x="466" y="44" >81</text>
  <text x="602" y="44" >chr2:101</text>
  <text x="786" y="44" >121</text>
  <text x="938" y="44" >140</text>
  <text x="10" y="76" >ref</text>
  <text x="10" y="108" >input</text>
  <text x="106" y="124" >R1 primary  60M20S  chr1:41  MAPQ 60   SA chr2,101,+,60S20M,40,0</text>
  <text x="10" y="140" >R1 +</text>
  <text x="106" y="172" >R1 supplementary  60H20M  chr2:101  MAPQ 40   SA chr1,41,+,60M20S,60,0</text>
  <text x="10" y="188" >R1 +</text>
  <text x="106" y="220" >R2 primary  35M  chr2:106  MAPQ 60</text>
  <text x="10" y="236" >R2 -</text>
  <text x="106" y="284" >chr2:106-120, 15 bases, R1 supplementary x R2: the primaries never meet</text>
  <text x="10" y="316" >output: R2 scores higher on the overlap (MAPQ 60 + Q30 vs 40 + Q30), so R1 gives up its copy</text>
  <text x="106" y="348" >R1 primary  60M20S  unchanged, but SA now chr2,101,+,60S5M15S,40,1 (NM over the 5M left)</text>
  <text x="10" y="364" >R1 +</text>
  <text x="106" y="396" >R1 supplementary  60H5M15S  chr2:101   SA chr1,41,+,60M20S,60,5 (NM from the primary&#39;s tag)</text>
  <text x="10" y="412" >R1 +</text>
  <text x="106" y="444" >R2 primary  35M  unchanged   (Q40 over chr2:106-120)</text>
  <text x="10" y="460" >R2 -</text>
  <text x="90" y="508" >a read, 5&#39; end to 3&#39; end: aligned (M)</text>
  <text x="90" y="524" >soft clip (S)</text>
  <text x="90" y="540" >hard clip (H): not in SEQ</text>
  <text x="90" y="556" >bases observed by both reads</text>
