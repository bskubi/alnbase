  <text x="10" y="12" >(c) A primary with nothing left: primary_inside_overlap, molecule chr2:141-160 (+) joined to chr1:41-120 (+), L = 100</text>
  <text x="122" y="44" >chr2:141</text>
  <text x="290" y="44" >chr1:41</text>
  <text x="466" y="44" >61</text>
  <text x="626" y="44" >81</text>
  <text x="786" y="44" >101</text>
  <text x="938" y="44" >120</text>
  <text x="10" y="76" >ref</text>
  <text x="10" y="108" >input</text>
  <text x="106" y="124" >R1 supplementary  20M60H  chr2:141  MAPQ 60</text>
  <text x="10" y="140" >R1 +</text>
  <text x="106" y="172" >R1 primary  20S60M  chr1:41  MAPQ 20</text>
  <text x="10" y="188" >R1 +</text>
  <text x="106" y="220" >R2 primary  80M  chr1:41  MAPQ 60</text>
  <text x="10" y="236" >R2 -</text>
  <text x="106" y="284" >chr1:41-100, 60 bases: every aligned base of R1&#39;s primary</text>
  <text x="10" y="316" >output: R2 keeps the overlap. R1&#39;s primary has nothing left; its surviving supplementary&#39;s</text>
  <text x="10" y="332" >alignment moves onto the primary record, which holds the whole read, and 60H becomes 60S</text>
  <text x="106" y="364" >R1 primary  20M60S  chr2:141  MAPQ 60  FLAG 97, 80 bp SEQ  (no supplementary line, no SA)</text>
  <text x="10" y="380" >R1 +</text>
  <text x="106" y="412" >R2 primary  80M  RNEXT chr2  PNEXT 141  MC 20M60S  TLEN 0  0x2 cleared (mates on different references)</text>
  <text x="10" y="428" >R2 -</text>
  <text x="106" y="460" >if no alignment of R1 had survived, R1 would be written unmapped, as in (d)</text>
  <text x="90" y="492" >a read, 5&#39; end to 3&#39; end: aligned (M)</text>
  <text x="90" y="508" >soft clip (S)</text>
  <text x="90" y="524" >hard clip (H): not in SEQ</text>
  <text x="90" y="540" >bases observed by both reads</text>
