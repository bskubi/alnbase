# The cytosine calls every expected.tsv in this directory is written against.
#
# A context here is the next one or two REFERENCE bases after a reference C,
# whatever the read did at those positions, and IUPAC-strict: a base the
# reference does not have -- past a contig end, or an N -- leaves the context
# undetermined (Cx) rather than guessed at. That is MethylDackel's rule.
#
# Bismark's rule is different: it projects the reference through the read's
# CIGAR, so a deleted base is skipped and an inserted one makes the context
# unknown. ../../query/extract/bismark.toml writes that rule out, and
# indel_reference_rule/README.md shows the two disagreeing on purpose.
#
# Run without `--insertions emit`, so an inserted read base contributes no
# column and the reference context stays contiguous. That is what makes these
# calls a property of the reference alone.
#
# Every pattern is three columns wide because the queries that exclude one
# another have to describe the same window. The third column is `~` where the
# context does not reach that far, which also matches a pad -- so a C in the
# last two bases of a contig still fires, and falls to Cx because its context
# columns are reference pads rather than bases.

[pattern.c_met]                 # a reference C read as C
read = "C~~"
refr = "C~~"
[pattern.c_unmet]               # a reference C read as T: converted by the bisulfite
read = "T~~"
refr = "C~~"

[pattern.cg_met]
read = "C~~"
refr = "CG~"
[pattern.cg_unmet]
read = "T~~"
refr = "CG~"

[pattern.chg_met]
read = "C~~"
refr = "CHG"
[pattern.chg_unmet]
read = "T~~"
refr = "CHG"

[pattern.chh_met]
read = "C~~"
refr = "CHH"
[pattern.chh_unmet]
read = "T~~"
refr = "CHH"

[query.CG_met]
where = "cg_met"
[query.CG_unmet]
where = "cg_unmet"

[query.CHG_met]
where = "chg_met"
[query.CHG_unmet]
where = "chg_unmet"

[query.CHH_met]
where = "chh_met"
[query.CHH_unmet]
where = "chh_unmet"

[query.Cx_met]              # a C whose context the reference does not supply
where = "c_met and not (cg_met or chg_met or chh_met)"
[query.Cx_unmet]
where = "c_unmet and not (cg_unmet or chg_unmet or chh_unmet)"
