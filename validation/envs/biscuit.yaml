# BISCUIT is built from source at a pinned commit (see build_biscuit.sh). BISCUIT's
# CMake fetches its own pinned htslib 1.18, utils and sgsl; this environment supplies
# the toolchain and system libraries, plus samtools for building test BAMs.
name: biscuit
channels: [conda-forge, bioconda]
dependencies:
  - c-compiler
  - make
  - cmake>=3.21
  - git
  - curl
  - libcurl
  - zlib
  - ncurses
  - samtools=1.24
