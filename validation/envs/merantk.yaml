# meRanTK is not on bioconda; it is a set of Perl scripts run from a checkout:
#
#   git clone https://github.com/icbi-lab/meRanTK
#
# validation/demos/merantk-strand was run against commit c06d726 (meRanTK 1.3.0, 2025-07-14).
# This environment is what those scripts need. meRanGh drives hisat2 and meRanGs drives STAR,
# so both aligners are here; Bio::DB::Sam and Parallel::ForkManager are the two non-core Perl
# modules the scripts use. perl-bio-samtools pins an old perl and an old samtools, which is why
# no samtools version is requested here -- the demo sorts with whatever samtools is on PATH.
#
# The project ships its own merantk.yml, which additionally lists bowtie2 (for meRanT,
# transcriptome alignment, which writes no conversion tag and no strand rule covers) and the
# GD and statistics modules that meRanCall needs. Neither is exercised by the demo.
name: merantk
channels: [conda-forge, bioconda]
dependencies:
  - perl-bio-samtools          # Bio::DB::Sam
  - perl-parallel-forkmanager
  - hisat2=2.2.1               # meRanGh
  - star=2.7.10a               # meRanGs
