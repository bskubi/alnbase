# bwa-meth 0.2.10 from bioconda, the version queries/strand/bwameth.toml was read from.
# The package is the bwameth.py script itself, so the line numbers cited in that file and in
# validation/demos/bwameth-strand/ are the ones in $CONDA_PREFIX/bin/bwameth.py here.
#
# bwameth pulls in bwa and bwa-mem2 as dependencies; only bwa is used below, because
# bwameth.py's default aligner is bwa mem. samtools is for sorting and for building BAMs.
name: bwameth
channels: [conda-forge, bioconda]
dependencies:
  - bwameth=0.2.10
  - samtools
