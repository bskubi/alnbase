# asTair is not on bioconda in a usable form and, more to the point, its PyPI release (3.3.2)
# is behind its master (3.3.3). It is a Python package run from a checkout:
#
#   git clone https://bitbucket.org/bsblabludwig/astair.git
#
# Bitbucket, not GitHub -- there is no asTair repository on GitHub, and an earlier version of
# queries/strand/astair.toml said there was. validation/demos/astair-strand was run against
# master b7df2790a06d66d298eb4d862af569e16e6a93d9 (2024-06-04), whose last commit adds a
# deprecation notice to the README: asTair is deprecated in favour of rastair
# (https://bitbucket.org/bsblabludwig/rastair), which has its own strand handling and is not
# covered by any rule here.
#
# Install into this environment from the checkout with `pip install -e .`. The pins below are
# what that install needs on a current machine: asTair's setup.py does not cap click, numpy or
# pyahocorasick, and it does not work with the current major version of any of them.
#
# TAPS does not convert the reference, so the aligner is an ordinary bwa rather than a
# three-letter one; samtools is for sorting and indexing.
name: astair
channels: [conda-forge, bioconda]
dependencies:
  - python=3.9
  - pip
  - bwa=0.7.19
  - samtools=1.21
  - pip:
    - "click<8"
    - "pyahocorasick<2"
    - "numpy<2"
    - pysam
