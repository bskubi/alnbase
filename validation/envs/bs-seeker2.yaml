# BS-Seeker2 is a Python 2 program that writes its BAM through pysam's old API
# (pysam.Samfile, pysam.AlignedRead), so the environment is pinned to python 2.7 and
# pysam < 0.9. build_bsseeker2.sh puts the scripts themselves into it.
name: bs-seeker2
channels: [conda-forge, bioconda]
dependencies:
  - python=2.7
  - pysam<0.9
  - bowtie2
  - samtools
