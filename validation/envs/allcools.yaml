# ALLCools bam-to-allc / extract-allc, GitHub master c9f7be2 (= PyPI 1.1.1).
name: allcools
channels: [conda-forge, bioconda]
dependencies:
  - python=3.10
  - samtools=1.24
  - htslib=1.24
  - pysam
  - pybedtools
  - pybigwig
  - anndata
  - xarray
  - natsort
  - seaborn
  - pyyaml
  - pip
  - pip:
    - "git+https://github.com/lhqing/ALLCools@c9f7be2ffd650c1a5430d2f6fc252c60f0c28e33"
