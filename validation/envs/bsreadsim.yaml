# BSReadSim (not on bioconda yet): built from source at a pinned commit.
# Writes origin-annotated BAMs with per-base methylation/conversion truth (zt:Z).
name: bsreadsim
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - pip
  - cmake
  - make
  - cxx-compiler
  - c-compiler
  - zlib
  - bzip2
  - xz
  - libcurl
  - openssl
  - pkg-config
  - autoconf
  - automake
  - git
  - samtools=1.24
  - pip:
      - "bsreadsim @ git+https://github.com/wbvguo/BSReadSim@9833bd7"
