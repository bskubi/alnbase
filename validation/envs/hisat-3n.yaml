# HISAT-3N is built from source (see build_hisat3n.sh). It is not a separate project but a
# branch of hisat2, and it is not on bioconda, so source is the only way to get it. This
# environment supplies the toolchain and system libraries, plus samtools for sorting and for
# building test BAMs.
name: hisat-3n
channels: [conda-forge, bioconda]
dependencies:
  - cxx-compiler
  - make
  - git
  - zlib
  - perl
  - python
  - samtools=1.24
