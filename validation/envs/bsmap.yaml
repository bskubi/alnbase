# BSMAP 2.90 from bioconda, the version queries/strand/bsmap.toml was read from. The
# package's source is the original 2.90 tarball (sha256 8b5ae4ba...f007ac2), so the line
# numbers cited in that file and in validation/demos/bsmap-strand/ match what runs here.
#
# samtools is not pinned: bsmap 2.90 needs zlib 1.2, which no recent samtools build accepts,
# so the solver is left to bring in the newest samtools that fits (1.21 as of 2026-09-17).
name: bsmap
channels: [conda-forge, bioconda]
dependencies:
  - bsmap=2.90
