# Every reference C read as C (retained) or T (converted), in any context. alnbase orients
# each read along its conversion strand, so this covers the C on both strands.

[pat.C_retained]
read = "C"
refr = "C"

[pat.C_converted]
read = "T"
refr = "C"

[query.C_retained]
where = "C_retained"

[query.C_converted]
where = "C_converted"
