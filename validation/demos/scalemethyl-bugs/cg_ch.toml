# C calls split as ScaleMethyl splits them: CG when the next reference base is G, CH
# otherwise; read C methylated, read T unmethylated. alnbase orients each read along its
# conversion strand, so this covers the C on both strands.

[pat.C_then_G]
read = "C~"
refr = "CG"

[pat.T_then_G]
read = "T~"
refr = "CG"

[pat.C_then_H]
read = "C~"
refr = "CH"

[pat.T_then_H]
read = "T~"
refr = "CH"

[query.CG_methylated]
where = "C_then_G"

[query.CG_unmethylated]
where = "T_then_G"

[query.CH_methylated]
where = "C_then_H"

[query.CH_unmethylated]
where = "T_then_H"
