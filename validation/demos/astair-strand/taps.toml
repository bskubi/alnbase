# TAPS reads a modified cytosine as T and an unmodified one as C, the opposite way round from
# bisulfite. Two queries at the same anchor, so the pair reproduces asTair's MOD and UNMOD
# columns directly: the anchor is the cytosine of a CG, and alnbase walks each read along the
# conversion strand queries/strand/astair.toml declared, so on a '-' record the position each
# hit reports is the G of that same forward-strand CG.

[query.CG_mod]
read = "T~"
refr = "CG"

[query.CG_unmod]
read = "C~"
refr = "CG"
