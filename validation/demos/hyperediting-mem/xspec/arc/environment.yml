# The pipeline's dependencies, pinned to the versions the chr21 and chr16-22
# runs were actually done with, so a cluster result and a laptop result are
# comparable rather than merely similar.
#
# These are not available as ARC modules. `module avail` there offers bowtie2,
# bamtools, bedtools2 and kallisto, but no bwa, no hisat2 and no samtools, so
# the environment has to be built rather than loaded. perl and python exist as
# modules (perl/5.42.0, python/3.12.12) but are included here too, to keep the
# whole toolchain in one place and pinned.
#
# Build it once on gscratch with setup_env.sh; it is ~1.5 GB and every compute
# node can see it.
#
# Notes on specific pins:
#
#   bwa 0.7.18 provides `xa2multi.pl`, which TransRunAligner.sh needs only on
#   the `bwa mem` path. The 2x2 uses `aln` and `hisat2`, so it is unused here,
#   but it costs nothing and keeps the `mem` arm runnable.
#
#   hisat2 2.2.1 provides `hisat2_extract_splice_sites.py`, which builds the
#   annotation half of the junction list. The pipeline calls it by bare name.
#
#   perl is here for the Hyper-editing tree's own scripts. setup.sh rewrites
#   their shebangs to `/usr/bin/perl`, so the system perl is what actually runs
#   them; this pin matters only for anything invoked as `perl script.pl`.
name: hyperedit
channels:
  - conda-forge
  - bioconda
dependencies:
  - bwa=0.7.18
  - hisat2=2.2.1
  - samtools=1.21
  - perl=5.32.1
  - python=3.11
