# Simulation profiles for the validation suite.
#
# Every number the suite reports is conditional on the simulation that produced
# it, so each simulation is named here rather than typed at a shell prompt, and
# `../bin/simulate.py` records the name beside the output. A profile is a claim
# about what it models: read `models` before quoting any figure derived from it.
#
# Run one with:
#     validation/bin/simulate.py lambda-illumina --out $SCRATCH/sims/lambda-illumina
#
# Parameters not listed take BSReadSim's own defaults, which the written
# manifest records in full.

# ---------------------------------------------------------------- references --

[reference.lambda]
accession = "NC_001416.1"
description = "Enterobacteria phage lambda, the spike-in genome of most bisulfite protocols"
url = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=nuccore&id=NC_001416.1&rettype=fasta&retmode=text"
contig = "chr"
length = 48502
# sha256 of the uppercased sequence alone, which is what BSReadSim records in
# its manifest as `reference_sequence_sha256`; the FASTA file's own digest
# depends on its header and line wrapping and so is not pinned here.
sequence_sha256 = "36432a40f602258d19ae7c8152ddbc30390b559f2859c01d7047c77b048c71b3"
# Lambda has no repeats. Nothing measured on it can speak to multimapping, and
# so nothing measured on it can establish what a MAPQ filter costs on a real
# genome. See "What lambda cannot answer" in README.md.

# ------------------------------------------------------------------ profiles --

[profile.lambda-stress]
reference = "lambda"
technology = "wgbs"
summary = "Indels and variants everywhere, so that indel-handling differences show up in quantity"
models = """
No real library. The mutation rate is 20x BSReadSim's own default and 20x human
germline heterozygosity, and 60% of those events are indels against roughly 12%
in human variation. The point is volume: 9,316 of 19,936 records carry an
insertion or deletion, which is what makes a caller's indel behaviour
measurable at all on a 48 kb genome.

Two of its settings are deliberately inconsistent with each other and must be
remembered when reading any figure from it. Phred is a flat 40 while the
substitution error rate is 0.005, so every base claims an error probability of
0.0001 and 1 in 200 of them is in fact wrong: base-quality filters (MethylDackel
`-p`, Bismark's `--ignore_quals` path) therefore remove nothing here, and their
cost is invisible. And because low MAPQ on a repeat-free genome can only come
from mismatch load, a 2% variant rate is what drives MethylDackel's default
MAPQ 10 to drop 36% of observations; that figure is a property of this profile,
not of the filter.
"""
supports = """
Every exact-equivalence result in the validation suite: the Bismark XM, extractor and
bismark2bedGraph mirrors, the MethylDackel site mirrors, and the truth scores.
Equivalence claims are the right use of this profile — two callers fed the same
extreme input either agree record for record or do not.
"""

[profile.lambda-stress.args]
depth = 60
read-length = 100
insert-min = 150
insert-mean = 300
insert-sd = 60
mutation-rate = 0.02
indel-fraction = 0.6
conversion-rate = 0.998
phred = 40
error-rate = 0.005
beta-cg = "0.5,0.5"
beta-chg = "0.01,0.05"
beta-chh = "0.01,0.05"
seed = 2

[profile.lambda-illumina]
reference = "lambda"
technology = "wgbs"
summary = "Human-like variation and Illumina-like sequencing, for rates that are meant to be quoted as rates"
models = """
A human WGBS library, as closely as a phage genome allows.

  variation     0.001 events per base, which is roughly the distance between
                two human haplotypes, with 12% of events indels after the usual
                8:1 SNV-to-indel ratio. This is also BSReadSim's own default.
  sequencing    Phred 30 with a matching 0.001 substitution rate, so a base
                quality means what it says and a quality filter has the effect
                on this data that it would have on real data.
  conversion    0.995, the low end of what a passing bisulfite run reports;
                0.998 is achievable but flattering.
  methylation   CG beta(0.65, 0.25), U-shaped with mean 0.72, against the
                measured 70-80% mean CG methylation of human somatic tissue.
                CH beta(0.05, 5.0), mean 0.0099, against the roughly 1%
                non-CG methylation of somatic tissue. The stress profile's
                CH beta(0.01, 0.05) has mean 0.167, which is a brain- or
                stem-cell-like level applied to everything.
  library       150 bp reads on a 350 bp insert, the common modern layout;
                the stress profile's 100 bp reads on 300 bp are older.

Depth is 120x rather than 60x because the events being counted are roughly
twenty times rarer here, and a rate needs observations behind it.

One consequence for whoever aligns these reads: a 350 bp mean with an 80 bp
standard deviation puts Bismark's default `--maxins 500` only 1.9 standard
deviations out, so the default silently discards about 3% of pairs, and the
pairs it discards are the long ones -- which are exactly the pairs whose mates
do not overlap, the subset the tool comparisons run on. Align with
`--maxins 700`.
"""
supports = """
Rates that are quoted as rates: per-call disagreement, what each caller's
default filters cost, precision and recall against truth. These are the numbers
a reader will take as descriptive of the tools, so they must come from input
that is descriptive of real data.

Not yet the MAPQ figure. See "What lambda cannot answer" in README.md.
"""

[profile.lambda-illumina.args]
depth = 120
read-length = 150
insert-min = 150
insert-mean = 350
insert-sd = 80
mutation-rate = 0.001
indel-fraction = 0.12
conversion-rate = 0.995
phred = 30
error-rate = 0.001
beta-cg = "0.65,0.25"
beta-chg = "0.05,5.0"
beta-chh = "0.05,5.0"
seed = 11
