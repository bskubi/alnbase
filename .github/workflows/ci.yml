name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A failed build should say why, not dump a stack.
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # htslib is built from source by hts-sys, and bindgen needs libclang.
      # samtools is for the fixtures, which build their BAMs from SAM.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libclang-dev perl \
            zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev \
            samtools

      - name: Toolchain
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Not --test-threads=1. The test fixtures are written to shared temp
      # paths, and a race there only shows up when tests run in parallel --
      # which is how it was found. Serialising would hide it again.
      - name: Tests
        run: cargo test

      # Debug and release can differ, particularly around the unsafe htslib
      # calls in bam_out and record_columns.
      - name: Tests (release)
        run: cargo test --release

      # An independent derivation of every column's coordinates, outside cargo test
      # so that none of its arithmetic is alnbase's (tests/oracle/README.md).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Walk oracle
        run: |
          pip install pysam pyfaidx duckdb
          cargo build --release
          python tests/oracle/walk_oracle.py --alnbase target/release/alnbase --records 3000 --seed 1

      # Hand-written edge cases, each diffed against the table it was written
      # with (tests/fixtures/README.md).
      - name: Fixtures
        run: PY=python ALNBASE="$PWD/target/release/alnbase" tests/fixtures/run.sh
